[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netdesign"
version = "0.1.0"
description = "Optimal microseismic network design from candidate station locations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "pyproj>=3.7.2",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
netdesign = "netdesign.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netdesign"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src/netdesign"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: takes more than 10 s"]
